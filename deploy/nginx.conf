# Reverse-proxy body size for advertisement (and other) uploads.
#
# Paste `client_max_body_size 30M;` into the existing `http { }` or
# `server { }` block. Do not replace a working nginx.conf with a bare
# `http { }` wrapper — that would drop the rest of the config.
#
# Equivalent:
# http {
#     client_max_body_size 30M;
# }

client_max_body_size 30M;
