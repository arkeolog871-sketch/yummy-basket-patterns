<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#111113" />
    <title>SİLVAN CEBİMDE — Android uygulama önizlemesi</title>
    <style>
      :root {
        --bezel: #0b0b0d;
        --screen: #fff8f0;
        --status: #1a1a1c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 50% -10%, #5a3a28 0%, transparent 55%),
          #141416;
        color: #f4ece4;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px 40px;
      }
      .label {
        text-align: center;
        margin-bottom: 18px;
      }
      .label strong {
        display: block;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .label span {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        color: #cbb8a8;
      }
      .phone {
        width: 393px;
        height: 852px;
        padding: 10px;
        border-radius: 48px;
        background: linear-gradient(160deg, #2a2a2e, #070708 55%);
        box-shadow:
          0 0 0 2px #3a3a40,
          0 24px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transform-origin: top center;
      }
      .shell {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        border-radius: 38px;
        background: var(--screen);
      }
      .punch {
        position: absolute;
        top: 10px;
        left: 50%;
        z-index: 3;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #050506;
        transform: translateX(-50%);
        box-shadow: inset 0 0 0 2px #1c1c20, 0 0 0 3px rgba(0, 0, 0, 0.18);
      }
      .status {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 8px 22px 0 18px;
        color: #f6f1ea;
        font-size: 12px;
        font-weight: 600;
        background: linear-gradient(to bottom, #17120e, #17120e 70%, transparent);
        mix-blend-mode: normal;
      }
      .status b { font-variant-numeric: tabular-nums; }
      .icons { display: flex; align-items: center; gap: 7px; }
      .icons i {
        display: block;
        background: currentColor;
      }
      .signal {
        width: 14px;
        height: 10px;
        clip-path: polygon(0 100%, 25% 70%, 25% 100%, 50% 45%, 50% 100%, 75% 20%, 75% 100%, 100% 0, 100% 100%);
      }
      .wifi {
        width: 13px;
        height: 10px;
        border: 2px solid currentColor;
        border-top: 0;
        border-radius: 0 0 10px 10px;
        background: transparent !important;
        transform: translateY(-1px);
      }
      .battery {
        width: 22px;
        height: 10px;
        border: 1.5px solid currentColor;
        border-radius: 2px;
        background: transparent !important;
        position: relative;
      }
      .battery::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 2px;
        width: 2px;
        height: 4px;
        border-radius: 0 1px 1px 0;
        background: currentColor;
      }
      .battery em {
        position: absolute;
        inset: 1px 1px 1px 1px;
        width: 70%;
        background: #7dffa1;
        border-radius: 1px;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: var(--screen);
      }
      .gesture {
        display: grid;
        place-items: center;
        height: 18px;
        background: #17120e;
      }
      .gesture span {
        width: 108px;
        height: 4px;
        border-radius: 99px;
        background: #d9d0c6;
      }
      @media (max-height: 920px) {
        .phone {
          transform: scale(0.82);
          margin: -70px 0;
        }
      }
      @media (max-width: 430px) {
        .wrap { padding: 12px 0 20px; }
        .phone {
          width: min(393px, 100vw - 16px);
          height: min(852px, 100svh - 72px);
          transform: none;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="label">
          <strong>SİLVAN CEBİMDE</strong>
          <span>Android mobil uygulama önizlemesi</span>
          <a href="/silvan-cebimde.apk" download="silvan-cebimde.apk" style="display:inline-block;margin-top:12px;padding:8px 16px;border-radius:999px;background:#ff8c42;color:#fff;font-size:13px;font-weight:600;text-decoration:none;">APK indir</a>
        </div>
        <div class="phone">
          <div class="shell">
            <div class="punch" aria-hidden="true"></div>
            <div class="status">
              <b id="clock">12:00</b>
              <div class="icons" aria-hidden="true">
                <i class="signal"></i>
                <i class="wifi"></i>
                <i class="battery"><em></em></i>
              </div>
            </div>
            <iframe id="app" title="SİLVAN CEBİMDE" allow="geolocation; clipboard-read; clipboard-write"></iframe>
            <div class="gesture"><span></span></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const clock = document.getElementById("clock");
      const tick = () => {
        clock.textContent = new Intl.DateTimeFormat("tr-TR", {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).format(new Date());
      };
      tick();
      setInterval(tick, 15000);

      const host = location.hostname;
      const sameApp =
        host === "localhost" ||
        host.endsWith("lovable.app") ||
        host.endsWith("lovableproject.com") ||
        host.endsWith("uygulamamcebimde.online");
      document.getElementById("app").src = sameApp ? "/" : "https://uygulamamcebimde.online/";
    </script>
  </body>
</html>
