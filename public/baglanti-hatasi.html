<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bağlantı kurulamadı</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        background: #f4edda;
        color: #17120e;
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 27%;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px 0 0;
        color: rgba(23, 18, 14, 0.7);
        font-size: 0.95rem;
      }
      button {
        margin-top: 24px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        background: #ff8c42;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo-mark.png" alt="" />
      <h1>Bağlantı kurulamadı</h1>
      <p>
        İnternet bağlantınızı kontrol edip tekrar deneyin. Bağlantınız varsa birkaç saniye sonra
        yeniden deneyebilirsiniz.
      </p>
      <button type="button" id="retry">Tekrar dene</button>
    </main>
    <script>
      // Capacitor uzaktaki adresi yükleyemediğinde bu sayfaya düşer (bkz.
      // capacitor.config.ts > server.errorPath). Aksi hâlde WKWebView boş beyaz
      // bir ekran gösteriyor ve uygulama bozuk görünüyor.
      document.getElementById("retry").addEventListener("click", function () {
        window.location.replace("https://uygulamamcebimde.online/");
      });
    </script>
  </body>
</html>
