<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111113" />
    <title>SİLVAN CEBİMDE — iPhone uygulamasını indir</title>
    <style>
      :root {
        --bezel: #0b0b0d;
        --screen: #fff8f0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 50% -10%, #5a3a28 0%, transparent 55%),
          #141416;
        color: #f4ece4;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px 40px;
      }
      .label {
        text-align: center;
        margin-bottom: 18px;
      }
      .label strong {
        display: block;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .label span {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        color: #cbb8a8;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .btn {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        background: #ff8c42;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid rgba(203, 184, 168, 0.4);
        color: #f4ece4;
      }
      .note {
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.5;
        color: #cbb8a8;
      }
      .phone {
        width: 393px;
        height: 852px;
        padding: 11px;
        border-radius: 54px;
        background: linear-gradient(160deg, #2a2a2e, #070708 55%);
        box-shadow:
          0 0 0 2px #3a3a40,
          0 24px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transform-origin: top center;
      }
      .shell {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        border-radius: 44px;
        background: var(--screen);
      }
      .island {
        position: absolute;
        top: 12px;
        left: 50%;
        z-index: 3;
        width: 118px;
        height: 34px;
        border-radius: 999px;
        background: #050506;
        transform: translateX(-50%);
      }
      .status {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 44px;
        padding: 12px 28px 0;
        color: #17120e;
        font-size: 12px;
        font-weight: 600;
      }
      .status b { font-variant-numeric: tabular-nums; }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: var(--screen);
      }
      .home {
        display: grid;
        place-items: center;
        height: 18px;
        background: var(--screen);
      }
      .home span {
        width: 128px;
        height: 4px;
        border-radius: 99px;
        background: rgba(23, 18, 14, 0.8);
      }
      @media (max-height: 920px) {
        .phone {
          transform: scale(0.82);
          margin: -70px 0;
        }
      }
      @media (max-width: 430px) {
        .wrap { padding: 12px 0 20px; }
        .phone {
          width: min(393px, 100vw - 16px);
          height: min(852px, 100svh - 72px);
          transform: none;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="label">
          <strong>SİLVAN CEBİMDE</strong>
          <span>iPhone uygulaması</span>
          <div class="actions">
            <a class="btn" href="/silvan-cebimde-iphone.mobileconfig">iPhone uygulamasını kur</a>
          </div>
          <p class="note">iPhone APK yüklemez. Bu bağlantı uygulamayı ana ekranınıza ekler.</p>
        </div>
        <div class="phone">
          <div class="shell">
            <div class="island" aria-hidden="true"></div>
            <div class="status">
              <b id="clock">12:00</b>
            </div>
            <iframe id="app" title="SİLVAN CEBİMDE" allow="geolocation; clipboard-read; clipboard-write"></iframe>
            <div class="home"><span></span></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const clock = document.getElementById("clock");
      const tick = () => {
        clock.textContent = new Intl.DateTimeFormat("tr-TR", {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).format(new Date());
      };
      tick();
      setInterval(tick, 15000);

      const host = location.hostname;
      const sameApp =
        host === "localhost" ||
        host.endsWith("lovable.app") ||
        host.endsWith("lovableproject.com") ||
        host.endsWith("uygulamamcebimde.online");
      document.getElementById("app").src = sameApp ? "/" : "https://uygulamamcebimde.online/";
    </script>
  </body>
</html>
