# Unsigned iOS Simulator compile check. No Apple certs, profiles, or Firebase/APNs secrets.
name: iOS Simulator build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: Unsigned simulator compile
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8 ships as a prebuilt XCFramework whose .swiftinterface
      # guards 106 declarations behind `#if compiler(>=5.3) &&
      # $NonescapableTypes` — a Swift 6 feature flag. Under macos-14's default
      # Xcode 15.4 (Swift 5.10) that condition is false, so members like
      # CAPPluginCall.reject and CAPBridgeProtocol.viewController silently
      # vanish from the module and any code using them fails to compile.
      # Nothing in the app touched them before, so the gap went unnoticed;
      # matching ios-release.yml's Xcode keeps this check representative of
      # the build that actually ships.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      # Capacitor iOS'ta eklenti taraması yok: köprü yalnızca
      # capacitor.config.json'daki packageClassList'i okuyor ve `cap sync` o
      # listeyi sadece npm eklenti paketlerinden üretip her seferinde baştan
      # yazıyor. Uygulama hedefindeki SilvanAuthPlugin derlenir ama kaydolmaz;
      # kaydolmazsa web tarafı köprüyü göremez ve sessizce tarayıcı akışına
      # düşer — Apple'ın reddettiği davranışın ta kendisi.
      - name: Register app-target Capacitor plugins
        run: node scripts/register-ios-app-plugins.mjs

      - name: Verify production Capacitor config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("ios/App/App/capacitor.config.json").read_text())
          assert cfg.get("appId") == "online.uygulamamcebimde.app", cfg.get("appId")
          assert cfg.get("server", {}).get("url") == "https://uygulamamcebimde.online", cfg.get("server")
          # Kaydedilmemis eklenti sessizce tarayici akisina duser; burada patlasin.
          for plugin in ("SilvanAuthPlugin", "SilvanPushPlugin"):
              assert plugin in cfg.get("packageClassList", []), (plugin, cfg.get("packageClassList"))
          resolved = json.loads(
              Path("ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved").read_text()
          )
          pins = {p["identity"]: p["state"].get("version") for p in resolved.get("pins", [])}
          assert pins.get("firebase-ios-sdk") == "11.11.0", pins
          print("packageClassList", cfg["packageClassList"])
          print("appId", cfg["appId"])
          print("server.url", cfg["server"]["url"])
          print("firebase-ios-sdk", pins["firebase-ios-sdk"])
          PY

      - name: Show Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build App for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/App/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
