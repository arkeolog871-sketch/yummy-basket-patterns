# İmzalı Android sürümü (APK + AAB). Yalnızca elle başlatılır.
#
# Gereken depo sırları (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    keystore dosyasının base64 hali
#                              (base64 -w0 silvan.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD  keystore parolası
#   ANDROID_KEY_ALIAS          anahtar takma adı
#   ANDROID_KEY_PASSWORD       anahtar parolası
#
# Keystore'u ASLA depoya koymayın: .gitignore *.jks / *.keystore dosyalarını
# engelliyor ama tek koruma o olmamalı. Keystore kaybolursa Play Store'daki
# uygulama bir daha GÜNCELLENEMEZ — yedeğini ayrı bir yerde saklayın.
name: Android sürüm (imzalı)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (Play Store her yüklemede artmasını ister; boşsa build.gradle.kts'teki değer)"
        required: false
        type: string
      versionName:
        description: "versionName (örn. 2.17; boşsa build.gradle.kts'teki değer)"
        required: false
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: İmzalı APK ve AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sırlar eksikken derleme başlatmak 20 dakika sonra anlaşılmaz bir
      # imzalama hatasıyla bitiyor; burada saniyesinde ve açık mesajla düşsün.
      - name: İmzalama sırlarının varlığını denetle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Şu depo sırları tanımlı değil:$missing"
            echo "Settings > Secrets and variables > Actions altından ekleyin."
            exit 1
          fi
          echo "İmzalama sırları yerinde."

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          # packages: '' ŞART. Eylemin varsayılanı artık Android deposundan
          # kaldırılmış olan 'tools' paketini kurmaya çalışıyor ve
          # "Failed to find package 'tools'" ile anında düşüyor. Boş bırakınca
          # eylem yalnızca ANDROID_HOME/PATH'i ayarlıyor; ihtiyacımız olan
          # paketleri bir sonraki adımda açıkça kuruyoruz.
          packages: ''

      - name: android-36 platformunu indir
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle kur (önbellekli)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      # Keystore diske yazılır: Gradle'ın signingConfig'i gerçek bir dosya
      # istiyor. RUNNER_TEMP iş bitince silinir ve depoya hiç girmez.
      - name: Keystore'u çöz
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # Telefondan 3784 karakteri tek seferde yapıştırmak çoğu zaman
          # yarıda kesiliyor (yaşandı: 3784 yerine 650 karakter geldi).
          # İsteyen sırrı dörde bölüp ayrı ayrı girebilsin; sırayla
          # birleştiriliyor. Kullanılmayan parçalar boş kalır, zararsız.
          KEYSTORE_BASE64_1: ${{ secrets.ANDROID_KEYSTORE_BASE64_1 }}
          KEYSTORE_BASE64_2: ${{ secrets.ANDROID_KEYSTORE_BASE64_2 }}
          KEYSTORE_BASE64_3: ${{ secrets.ANDROID_KEYSTORE_BASE64_3 }}
          KEYSTORE_BASE64_4: ${{ secrets.ANDROID_KEYSTORE_BASE64_4 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-signing"

          # base64 alfabesi DIŞINDAKİ her karakteri at. Sadece boşluk temizlemek
          # yetmiyor: metin telefondan/sohbetten kopyalandığında görünmez BOM,
          # akıllı tırnak veya yazı yönü işareti taşıyabiliyor ve `base64 -d`
          # bunlara "invalid input" deyip duruyor.
          CLEAN=$(printf '%s%s%s%s%s' \
            "$KEYSTORE_BASE64" "$KEYSTORE_BASE64_1" "$KEYSTORE_BASE64_2" \
            "$KEYSTORE_BASE64_3" "$KEYSTORE_BASE64_4" | tr -dc 'A-Za-z0-9+/=')
          LEN=${#CLEAN}
          echo "Temizlenmiş base64 uzunluğu: $LEN karakter"
          if [ "$LEN" -eq 0 ]; then
            echo "ANDROID_KEYSTORE_BASE64 boş görünüyor."; exit 1
          fi
          # Kırpılmış yapıştırmayı sessizce kabul etme: bozuk keystore ile
          # imzalanmış bir APK telefonlara kurulmaz ve sebebi geç anlaşılır.
          if [ $((LEN % 4)) -ne 0 ]; then
            echo "Uzunluk 4'ün katı değil ($LEN) — yapıştırma EKSİK."
            echo "Sırrı bilgisayardan yeniden yapıştırın ya da dörde bölüp"
            echo "ANDROID_KEYSTORE_BASE64_1..4 sırlarına sırayla girin."
            exit 1
          fi

          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/android-signing/release.jks" \
            || { echo "base64 çözülemedi — sır base64 metni değil."; exit 1; }
          SIZE=$(stat -c%s "$RUNNER_TEMP/android-signing/release.jks")
          echo "Çözülen keystore: $SIZE bayt"
          test "$SIZE" -gt 0 || { echo "Keystore boş çıktı."; exit 1; }

          # Parola ve alias doğru mu: 20 dakikalık derlemenin sonunda değil,
          # burada anlaşılsın. Bozuk/kırpılmış keystore de burada yakalanır.
          keytool -list -keystore "$RUNNER_TEMP/android-signing/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 \
            || { echo "Keystore açılamadı: parola/alias hatalı ya da dosya bozuk."; exit 1; }
          echo "Keystore çözüldü, parola ve alias doğrulandı."

      - name: İmzalı APK ve AAB derle
        working-directory: android-wrapper
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Boş bırakılırsa build.gradle.kts kendi varsayılanına düşer.
          ANDROID_VERSION_CODE: ${{ inputs.versionCode }}
          ANDROID_VERSION_NAME: ${{ inputs.versionName }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      # İmzasız bir APK sessizce üretilip dağıtılırsa telefonlara kurulmaz.
      # apksigner'a sorup emin oluyoruz.
      - name: İmzayı ve izinleri doğrula
        working-directory: android-wrapper
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "APK üretilmedi"; exit 1; }
          test -f "$AAB" || { echo "AAB üretilmedi"; exit 1; }

          echo "--- imza doğrulaması"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"

          echo "--- paket ve izinler"
          "$TOOLS/aapt2" dump badging "$APK" > /tmp/badging.txt
          grep '^package:' /tmp/badging.txt
          grep '^uses-permission' /tmp/badging.txt
          for perm in \
            android.permission.INTERNET \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.POST_NOTIFICATIONS
          do
            grep -q "name='$perm'" /tmp/badging.txt \
              || { echo "EKSİK İZİN: $perm"; exit 1; }
          done

      - name: İmzalı çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android-wrapper/app/build/outputs/apk/release/app-release.apk
            android-wrapper/app/build/outputs/bundle/release/app-release.aab
            android-wrapper/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
